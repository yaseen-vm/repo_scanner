name: "Repo Scanner — AI Code Analysis & Auto-Fix"
description: "AI-powered scanner that finds bugs, security issues, and auto-fixes them with linter validation."
author: "yaseen-vm"

inputs:
  mimo_api_key:
    description: "MiMo API key from platform.xiaomimimo.com"
    required: false
  llm_api_key:
    description: "API key for the LLM provider (fallback if mimo_api_key not set)"
    required: false
  llm_base_url:
    description: "Base URL for the LLM API"
    required: false
    default: "https://api.xiaomimimo.com/v1"
  llm_model:
    description: "Model name to use for analysis"
    required: false
    default: "mimo-v2.5-pro"
  severity_threshold:
    description: "Minimum severity to report (low/medium/high/critical)"
    required: false
    default: "medium"
  max_files:
    description: "Maximum number of files to analyze per run"
    required: false
    default: "50"
  create_issues:
    description: "Create GitHub issues for findings (true/false)"
    required: false
    default: "false"
  post_comment:
    description: "Post PR comment with summary (true/false)"
    required: false
    default: "true"
  full_scan:
    description: "Scan all files instead of just changed ones (true/false)"
    required: false
    default: "false"
  ignore_patterns:
    description: "Comma-separated glob patterns to ignore"
    required: false
    default: ""
  categories:
    description: "Comma-separated categories to analyze: security,bug,performance,quality"
    required: false
    default: "security,bug,performance,quality"
  config_file:
    description: "Path to config YAML file"
    required: false
    default: ""
  mode:
    description: "Action mode: 'scan', 'fix', or 'plan'"
    required: false
    default: "scan"
  max_fixes:
    description: "Maximum number of issues to fix per run (fix mode only)"
    required: false
    default: "3"
  github_token:
    description: "GitHub token for API access (defaults to github.token)"
    required: false
    default: ${{ github.token }}
  issue_number:
    description: "Fix a specific issue by number (fix mode only)"
    required: false
    default: ""
  min_age_days:
    description: "Only fix issues older than this many days, 0 = no limit (fix mode only)"
    required: false
    default: "0"
  sarif_output:
    description: "Generate SARIF output for GitHub Security tab (true/false)"
    required: false
    default: "true"
  validate_fixes:
    description: "Run linter on generated fixes before creating PR (true/false)"
    required: false
    default: "true"
  replan:
    description: "Delete existing plan comment and regenerate (plan mode only)"
    required: false
    default: "false"
  from_plan:
    description: "Read fix details from plan comment instead of issue body (fix mode only)"
    required: false
    default: "false"
  email_notifications:
    description: "Enable email notifications (true/false)"
    required: false
    default: "false"
  smtp_server:
    description: "SMTP server for email notifications"
    required: false
    default: ""
  smtp_port:
    description: "SMTP port for email notifications"
    required: false
    default: "587"
  smtp_username:
    description: "SMTP username for email notifications"
    required: false
    default: ""
  smtp_password:
    description: "SMTP password for email notifications"
    required: false
    default: ""
  sender_email:
    description: "Sender email address for notifications"
    required: false
    default: ""
  recipient_email:
    description: "Recipient email address for notifications"
    required: false
    default: ""

outputs:
  report_path:
    description: "Path to the generated markdown report"
    value: ${{ steps.run-scanner.outputs.report_path }}
  total_issues:
    description: "Total number of issues found"
    value: ${{ steps.run-scanner.outputs.total_issues }}
  json_report_path:
    description: "Path to the JSON report"
    value: ${{ steps.run-scanner.outputs.json_report_path }}
  fixes_created:
    description: "Number of auto-fix PRs created (fix mode only)"
    value: ${{ steps.run-scanner.outputs.fixes_created }}
  pr_urls:
    description: "Comma-separated URLs of auto-fix PRs (fix mode only)"
    value: ${{ steps.run-scanner.outputs.pr_urls }}
  sarif_path:
    description: "Path to the SARIF report file"
    value: ${{ steps.run-scanner.outputs.sarif_path }}

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Checkout repo scanner
      uses: actions/checkout@v4
      with:
        repository: yaseen-vm/repo_scanner
        path: _repo_scanner
        ref: master

    - name: Install dependencies
      shell: bash
      run: |
        pip install openai PyGithub pyyaml click rich
        pip install -e _repo_scanner/

    - name: Run Repo Scanner
      id: run-scanner
      shell: bash
      env:
        LLM_API_KEY: ${{ inputs.mimo_api_key || inputs.llm_api_key }}
        MIMO_API_KEY: ${{ inputs.mimo_api_key || inputs.llm_api_key }}
        LLM_BASE_URL: ${{ inputs.llm_base_url }}
        LLM_MODEL: ${{ inputs.llm_model }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
        MAX_FILES: ${{ inputs.max_files }}
        IGNORE_PATTERNS: ${{ inputs.ignore_patterns }}
        CATEGORIES: ${{ inputs.categories }}
        VALIDATE_FIXES: ${{ inputs.validate_fixes }}
        EMAIL_NOTIFICATIONS: ${{ inputs.email_notifications }}
        SMTP_SERVER: ${{ inputs.smtp_server }}
        SMTP_PORT: ${{ inputs.smtp_port }}
        SMTP_USERNAME: ${{ inputs.smtp_username }}
        SMTP_PASSWORD: ${{ inputs.smtp_password }}
        SENDER_EMAIL: ${{ inputs.sender_email }}
        RECIPIENT_EMAIL: ${{ inputs.recipient_email }}
      run: |
        if [ "${{ inputs.mode }}" = "plan" ]; then
          PLAN_ARGS=("plan" "--issue-number" "${{ inputs.issue_number }}")

          if [ "${{ inputs.replan }}" = "true" ]; then
            PLAN_ARGS+=("--replan")
          fi

          if [ "${{ inputs.config_file }}" != "" ]; then
            PLAN_ARGS+=("--config" "${{ inputs.config_file }}")
          fi

          python -m repo_scanner.main "${PLAN_ARGS[@]}"

        elif [ "${{ inputs.mode }}" = "fix" ]; then
          FIX_ARGS=("fix")

          if [ "${{ inputs.max_fixes }}" != "" ]; then
            FIX_ARGS+=("--max-fixes" "${{ inputs.max_fixes }}")
          fi

          if [ "${{ inputs.severity_threshold }}" != "" ]; then
            FIX_ARGS+=("--severity" "${{ inputs.severity_threshold }}")
          fi

          if [ "${{ inputs.config_file }}" != "" ]; then
            FIX_ARGS+=("--config" "${{ inputs.config_file }}")
          fi

          if [ "${{ inputs.issue_number }}" != "" ]; then
            FIX_ARGS+=("--issue-number" "${{ inputs.issue_number }}")
          fi

          if [ "${{ inputs.min_age_days }}" != "" ] && [ "${{ inputs.min_age_days }}" != "0" ]; then
            FIX_ARGS+=("--min-age-days" "${{ inputs.min_age_days }}")
          fi

          if [ "${{ inputs.from_plan }}" = "true" ]; then
            FIX_ARGS+=("--from-plan")
          fi

          python -m repo_scanner.main "${FIX_ARGS[@]}"
        else
          CMD_ARGS=("scan")

          if [ "${{ inputs.severity_threshold }}" != "" ]; then
            CMD_ARGS+=("--severity" "${{ inputs.severity_threshold }}")
          fi

          if [ "${{ inputs.create_issues }}" = "true" ]; then
            CMD_ARGS+=("--create-issues")
          else
            CMD_ARGS+=("--no-create-issues")
          fi

          if [ "${{ inputs.post_comment }}" = "true" ]; then
            CMD_ARGS+=("--post-comment")
          else
            CMD_ARGS+=("--no-post-comment")
          fi

          if [ "${{ inputs.full_scan }}" = "true" ]; then
            CMD_ARGS+=("--full-scan")
          else
            CMD_ARGS+=("--diff-only")
          fi

          if [ "${{ inputs.config_file }}" != "" ]; then
            CMD_ARGS+=("--config" "${{ inputs.config_file }}")
          fi

          CMD_ARGS+=("--output" "/tmp/repo-scanner-report.md")
          CMD_ARGS+=("--output-json" "/tmp/repo-scanner-report.json")

          if [ "${{ inputs.sarif_output }}" = "true" ]; then
            CMD_ARGS+=("--output-sarif" "/tmp/repo-scanner-results.sarif")
          fi

          python -m repo_scanner.main "${CMD_ARGS[@]}"

          echo "report_path=/tmp/repo-scanner-report.md" >> "$GITHUB_OUTPUT"
          echo "json_report_path=/tmp/repo-scanner-report.json" >> "$GITHUB_OUTPUT"

          ISSUES_COUNT=$(python -c "import json; data=json.load(open('/tmp/repo-scanner-report.json')); print(data.get('total_issues', 0))" 2>/dev/null || echo "0")
          echo "total_issues=$ISSUES_COUNT" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.sarif_output }}" = "true" ]; then
            echo "sarif_path=/tmp/repo-scanner-results.sarif" >> "$GITHUB_OUTPUT"
          fi

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: inputs.sarif_output == 'true' && always()
      with:
        sarif_file: /tmp/repo-scanner-results.sarif

branding:
  icon: "shield"
  color: "blue"
