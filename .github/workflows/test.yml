name: Scan

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Repo Scanner
        uses: ./
        id: scanner
        with:
          llm_api_key: ${{ secrets.MIMO_API_KEY || secrets.LLM_API_KEY }}
          llm_base_url: ${{ secrets.LLM_BASE_URL || 'https://api.xiaomimimo.com/v1' }}
          llm_model: ${{ secrets.LLM_MODEL || 'mimo-v2.5-pro' }}
          severity_threshold: medium
          max_files: 50
          create_issues: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          post_comment: ${{ github.event_name == 'pull_request' }}

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-scanner-report
          path: |
            /tmp/repo-scanner-report.md
            /tmp/repo-scanner-report.json

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: /tmp/repo-scanner-results.sarif

      - name: Report issue count
        if: always()
        run: |
          echo "Found ${{ steps.scanner.outputs.total_issues }} issue(s)"
          # Uncomment to fail the build on any issues:
          # exit 1
