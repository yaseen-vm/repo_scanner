name: Mark Fix Rejected on PR Close

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  mark-rejected:
    # Only fires for unmerged PRs on fix/ branches created by repo-scanner[bot]
    if: |
      !github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'fix/') &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Find linked issue and mark fix-rejected
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/Closes #(\d+)/);
            if (!match) return;
            const issueNumber = parseInt(match[1]);

            // Add fix-rejected label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['fix-rejected']
            }).catch(() => {});

            // Remove fix-in-progress label
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'fix-in-progress'
            }).catch(() => {});

            // Post a comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `❌ The auto-fix PR was closed without merging.\n\nIf the fix approach was wrong, add \`replan\` to generate a new plan. If the issue is already resolved, close this issue manually.`
            });
