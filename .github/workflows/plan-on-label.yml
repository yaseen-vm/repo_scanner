name: AI Fix Plan on Label

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  plan:
    # Fires when 'plan' or 'replan' is added to any open issue
    if: |
      (github.event.label.name == 'plan' || github.event.label.name == 'replan') &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate AI Fix Plan
        uses: ./
        id: planner
        with:
          mimo_api_key: ${{ secrets.MIMO_API_KEY || secrets.LLM_API_KEY }}
          llm_base_url: ${{ secrets.LLM_BASE_URL || 'https://api.xiaomimimo.com/v1' }}
          llm_model: ${{ secrets.LLM_MODEL || 'mimo-v2.5-pro' }}
          mode: plan
          issue_number: ${{ github.event.issue.number }}
          replan: ${{ github.event.label.name == 'replan' }}
