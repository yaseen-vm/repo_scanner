name: Repo Scanner - Scan

on:
  workflow_call:
    inputs:
      severity_threshold:
        description: "Minimum severity to report (low/medium/high/critical)"
        type: string
        default: "medium"
      max_files:
        description: "Maximum number of files to analyze per run"
        type: string
        default: "50"
      create_issues:
        description: "Create GitHub issues for findings (true/false)"
        type: string
        default: "false"
      post_comment:
        description: "Post PR comment with summary (true/false)"
        type: string
        default: "true"
      full_scan:
        description: "Scan all files instead of just changed ones (true/false)"
        type: string
        default: "false"
      ignore_patterns:
        description: "Comma-separated glob patterns to ignore"
        type: string
        default: ""
      llm_model:
        description: "Model name to use for analysis"
        type: string
        default: "mimo-v2.5-pro"
      llm_base_url:
        description: "Base URL for the LLM API"
        type: string
        default: "https://api.xiaomimimo.com/v1"
      config_file:
        description: "Path to config YAML file"
        type: string
        default: ""
    secrets:
      mimo_api_key:
        description: "MiMo API key"
        required: false
      llm_api_key:
        description: "LLM API key (fallback if mimo_api_key not set)"
        required: false
    outputs:
      report_path:
        description: "Path to the generated markdown report"
        value: ${{ jobs.scan.outputs.report_path }}
      total_issues:
        description: "Total number of issues found"
        value: ${{ jobs.scan.outputs.total_issues }}
      json_report_path:
        description: "Path to the JSON report"
        value: ${{ jobs.scan.outputs.json_report_path }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      report_path: ${{ steps.scanner.outputs.report_path }}
      total_issues: ${{ steps.scanner.outputs.total_issues }}
      json_report_path: ${{ steps.scanner.outputs.json_report_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repo Scanner
        uses: yaseen-vm/repo_scanner@master
        id: scanner
        with:
          mimo_api_key: ${{ secrets.mimo_api_key }}
          llm_api_key: ${{ secrets.llm_api_key }}
          llm_base_url: ${{ inputs.llm_base_url }}
          llm_model: ${{ inputs.llm_model }}
          severity_threshold: ${{ inputs.severity_threshold }}
          max_files: ${{ inputs.max_files }}
          create_issues: ${{ inputs.create_issues }}
          post_comment: ${{ inputs.post_comment }}
          full_scan: ${{ inputs.full_scan }}
          ignore_patterns: ${{ inputs.ignore_patterns }}
          config_file: ${{ inputs.config_file }}

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-scanner-report
          path: |
            /tmp/repo-scanner-report.md
            /tmp/repo-scanner-report.json
